name: Build & Test Modern EDM (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ModernEDM-Windows-x64
            asset_path: dist/ModernEDM.exe
          - os: macos-latest
            artifact_name: ModernEDM-macOS-App
            asset_path: dist/ModernEDM-macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests, build PyInstaller package, and smoke-check binary
        run: python build_release.py

      - name: Build macOS Disk Image (.dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Modern EDM" -srcfolder "dist/ModernEDM.app" -ov -format UDZO "dist/ModernEDM-macOS.dmg"

      - name: Upload Windows Executable Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/ModernEDM.exe

      - name: Upload macOS Bundle & DMG Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/ModernEDM-macOS.zip
            dist/ModernEDM-macOS.dmg

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ModernEDM.exe
            dist/ModernEDM-macOS.zip
            dist/ModernEDM-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
